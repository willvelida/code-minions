version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    assignees:
      - willvelida
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - willvelida
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
