# git-cliff configuration for code-minions
# https://git-cliff.org/docs/configuration
#
# Regenerate: make changelog
# Or directly: git-cliff --output CHANGELOG.md

[changelog]
# Header placed at the very top of the generated file.
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/),
and this project adheres to [Semantic Versioning](https://semver.org/).

"""

# Tera template for the body of each release section.
body = """
{%- macro remote_url() -%}
  https://github.com/willvelida/code-minions
{%- endmacro -%}

{% if version -%}
  {% if previous.version -%}
    ## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
  {% else -%}
    ## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/releases/tag/{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
  {% endif -%}
{% else -%}
  ## [Unreleased]({{ self::remote_url() }}/compare/{{ previous.version }}...HEAD)
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
  ### {{ group | striptags | trim }}
  {% for commit in commits %}
    - {{ commit.message | split(pat="\n") | first | trim }}\
    {%- if commit.breaking %} (**BREAKING**){% endif -%}
  {% endfor %}
{% endfor %}
\n
"""

# Footer placed at the very bottom of the generated file.
footer = """
<!-- generated by git-cliff -->
"""

# Remove leading/trailing whitespace from the template output.
trim = true

# Postprocessors run regex replacements on the final output.
postprocessors = [
  # Turn issue/PR references like #123 into GitHub links.
  { pattern = '(\s|\()#(\d+)', replace = '$1[#$2](https://github.com/willvelida/code-minions/issues/$2)' },
]

[git]
# Parse conventional commits (feat:, fix:, etc.)
conventional_commits = true
filter_unconventional = true
split_commits = false

# Map commit prefixes to changelog sections.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^refactor", group = "<!-- 2 -->Refactor" },
  { message = "^doc", group = "<!-- 3 -->Documentation" },
  { message = "^perf", group = "<!-- 4 -->Performance" },
  { message = "^style", group = "<!-- 5 -->Styling" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^ci", group = "<!-- 7 -->CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore", group = "<!-- 8 -->Miscellaneous" },
]

# Protect email addresses from being parsed as groups.
protect_breaking_commits = false
filter_commits = false
topo_order = true
sort_commits = "oldest"
